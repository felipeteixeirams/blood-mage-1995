name: OpenCode Agent

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    # Roda apenas se o comentário começar com /oc
    if: startsWith(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Run OpenCode Command
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extrai a instrução após o /oc
          PROMPT=$(echo "${{ github.event.comment.body }}" | sed 's/\/oc //')
          # Usa o roteador oficial de modelos 100% gratuitos do OpenRouter com suporte a ferramentas
          opencode run "$PROMPT" --model openrouter/free

      - name: Create Pull Request with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix/feat: alterações sugeridas pelo OpenCode"
          title: "🤖 OpenCode: Alterações automáticas"
          body: "Alterações geradas automaticamente com base no comando: `${{ github.event.comment.body }}`"
          branch: "opencode-updates"
